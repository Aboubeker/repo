name: Paquet d'installation

# Le paquet est fabriqué sur un runner Windows, seul moyen d'obtenir un vrai
# .exe : un binaire Windows ne peut pas être produit depuis Linux sans chaîne
# de compilation croisée.
on:
  push:
    tags: ['v*']
  workflow_dispatch:        # fabrication à la demande, sans créer de version

permissions:
  contents: write           # nécessaire pour publier la release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances
        run: npm ci

      # Un paquet ne doit jamais être publié sans que la suite soit verte :
      # l'utilisateur final n'a aucun moyen de diagnostiquer une régression.
      - name: Tests
        run: npm test

      - name: Fabrication du paquet
        run: node scripts/build-package.mjs

      - name: Archive
        run: Compress-Archive -Path release\* -DestinationPath CliniRDV-Windows.zip
        shell: pwsh

      # Empreinte SHA-256 : permet à la clinique de verifier que l'archive
      # telechargee est bien celle qui a ete publiee.
      - name: Empreinte
        run: |
          $h = (Get-FileHash CliniRDV-Windows.zip -Algorithm SHA256).Hash
          "$h  CliniRDV-Windows.zip" | Out-File -Encoding ascii SHA256.txt
          Write-Host $h
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: CliniRDV-Windows
          path: |
            CliniRDV-Windows.zip
            SHA256.txt

      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CliniRDV-Windows.zip
            SHA256.txt
          body: |
            Paquet d'installation CliniRDV pour Windows 10/11.

            1. Télécharger `CliniRDV-Windows.zip` et l'extraire
            2. Double-cliquer sur `Installer.cmd`
            3. Puis sur `CliniRDV.cmd` pour ouvrir le panneau de contrôle

            Le code applicatif est compilé dans `CliniRDV.exe` : les sources
            ne sont pas distribuées. Vérifiez l'empreinte SHA-256 fournie.
